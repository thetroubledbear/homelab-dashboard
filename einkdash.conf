# Kindle-side settings. Edit SERVER to point at your LXC.
SERVER="http://192.168.1.50:8080/dash.png"
INTERVAL=600         # 10 min. Lower = fresher data, shorter battery life.
FULL_EVERY=4         # full refresh every 4th update to clear ghosting
WIFI_TIMEOUT=45      # seconds to wait for the network before giving up
STOP_FRAMEWORK=0     # 0 = leave the Kindle UI running (use this for the first test)
                     # 1 = kill the UI so it cannot repaint over the dashboard
